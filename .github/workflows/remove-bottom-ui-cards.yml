name: Remove bottom UI cards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove bottom cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/GameShell.js')
          s = p.read_text()
          updated = re.sub(r'<div className="monetization">.*?</div></section>', '</section>', s, count=1, flags=re.S)
          if updated == s:
              raise SystemExit('monetization block not found')
          p.write_text(updated)
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GameShell.js
          git rm .github/workflows/remove-bottom-ui-cards.yml
          git commit -m "Remove leaderboard and campaign cards from game screen"
          git push
